<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taoshenn.cloud</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;700&family=Share+Tech+Mono&display=swap');

:root {
    --terminal-bg: #0a0a12;
    --terminal-green: #0f0;
    --terminal-cyan: #0ff;
    --terminal-purple: #b19cd9;
    --terminal-red: #f44;
    --terminal-glow: rgba(0, 255, 0, 0.7);
    --text-color: #e0e0e0;
    --text-shadow: 0 0 8px var(--terminal-glow);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: #000;
    overflow: hidden;
    font-family: "Inconsolata", "PingFang SC", "Microsoft YaHei", monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    perspective: 1000px;
}

.matrix-background {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: -1;
    opacity: 0.15;
}

.terminal-container {
    position: relative;
    width: 85%;
    max-width: 900px;
    height: 75vh;
    background: var(--terminal-bg);
    border-radius: 8px;
    box-shadow: 0 0 30px rgba(0, 255, 0, 0.5), inset 0 0 10px rgba(0, 255, 0, 0.2);
    overflow: hidden;
    border: 1px solid var(--terminal-green);
    transform-style: preserve-3d;
    animation: float 8s ease-in-out infinite;
}

@keyframes float {
    0%, 100% { transform: translateY(0) rotateX(10deg) rotateY(5deg); }
    50% { transform: translateY(-20px) rotateX(5deg) rotateY(10deg); }
}

.terminal-header {
    background: linear-gradient(to right, #0a0a0a, #111);
    padding: 8px 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--terminal-green);
    font-family: "Share Tech Mono", "PingFang SC", monospace;
    border-bottom: 1px solid var(--terminal-green);
    box-shadow: 0 2px 15px rgba(0, 255, 0, 0.3);
    font-size: 1rem;
}

.terminal-buttons { display: flex; gap: 8px; }
.terminal-button {
    width: 12px; height: 12px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.2);
}
.terminal-button.red { background: #ff5f56; }
.terminal-button.yellow { background: #ffbd2e; }
.terminal-button.green { background: #27c93f; }

.glitch { position: relative; font-weight: bold; }
.glitch::before,
.glitch::after {
    content: attr(data-text);
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: var(--terminal-bg);
}
.glitch::before {
    left: 2px;
    text-shadow: -2px 0 var(--terminal-red);
    clip: rect(24px, 550px, 90px, 0);
    animation: glitch-anim-1 2s infinite linear alternate-reverse;
}
.glitch::after {
    left: -2px;
    text-shadow: -2px 0 var(--terminal-cyan);
    clip: rect(85px, 550px, 140px, 0);
    animation: glitch-anim-2 2s infinite linear alternate-reverse;
}

@keyframes glitch-anim-1 {
    0% { clip: rect(54px, 800px, 54px, 0); }
    20% { clip: rect(27px, 800px, 86px, 0); }
    40% { clip: rect(14px, 800px, 75px, 0); }
    60% { clip: rect(39px, 800px, 104px, 0); }
    80% { clip: rect(18px, 800px, 53px, 0); }
    100% { clip: rect(73px, 800px, 112px, 0); }
}
@keyframes glitch-anim-2 {
    0% { clip: rect(35px, 800px, 89px, 0); }
    20% { clip: rect(56px, 800px, 103px, 0); }
    40% { clip: rect(22px, 800px, 64px, 0); }
    60% { clip: rect(88px, 800px, 120px, 0); }
    80% { clip: rect(13px, 800px, 32px, 0); }
    100% { clip: rect(42px, 800px, 99px, 0); }
}

.terminal-body {
    padding: 15px;
    height: calc(100% - 40px);
    overflow-y: auto;
    color: var(--text-color);
    text-shadow: var(--text-shadow);
    line-height: 1.6;
}

.typing-text {
    white-space: pre-wrap;
    font-size: 1.1rem;
}

.command-line {
    margin-top: 20px;
    display: flex;
    align-items: center;
}
.command-line.hidden { display: none; }

.prompt {
    color: var(--terminal-green);
    margin-right: 10px;
    font-weight: bold;
}

.cursor {
    display: inline-block;
    width: 10px;
    height: 20px;
    background: var(--terminal-green);
    animation: blink 1s infinite;
    vertical-align: middle;
}
@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
}

.command-input {
    flex-grow: 1;
    background: transparent;
    border: none;
    color: var(--terminal-green);
    font-family: "Inconsolata", "PingFang SC", "Microsoft YaHei", monospace;
    font-size: 1.1rem;
    outline: none;
    caret-color: var(--terminal-green);
    text-shadow: var(--text-shadow);
}

.contact-item a {
    color: var(--terminal-purple);
    text-decoration: none;
    transition: all 0.3s;
}
.contact-item a:hover {
    color: var(--terminal-cyan);
    text-shadow: 0 0 10px var(--terminal-cyan);
}

canvas { display: block; }
</style>
</head>
<body>
<canvas id="matrix" class="matrix-background"></canvas>

<div class="terminal-container">
    <div class="terminal-header">
        <div class="terminal-buttons">
            <div class="terminal-button red"></div>
            <div class="terminal-button yellow"></div>
            <div class="terminal-button green"></div>
        </div>
        <div class="glitch" data-text="Taoshenn@cloud">Taoshenn@cloud</div>
        <div id="clock" style="color:var(--terminal-green);font-family:'Share Tech Mono',monospace;"></div>
    </div>
    <div class="terminal-body" id="terminal-body">
        <div id="typing-text" class="typing-text"></div>
        <div id="command-line" class="command-line hidden">
            <span class="prompt">></span>
            <input type="text" class="command-input" id="command-input" autocomplete="off" aria-label="终端命令输入">
            <span class="cursor"></span>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const alphabet =
  "アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン" +
  "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789あいうえおかきくけこ一二三四五六七八九十零";
const fontSize = 16;
let columns = Math.floor(canvas.width / fontSize);
let rainDrops = Array(columns).fill(1);

function draw() {
  ctx.fillStyle = "rgba(0,0,0,0.05)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#0f0";
  ctx.font = fontSize + "px monospace";
  for (let i = 0; i < rainDrops.length; i++) {
    const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
    ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);
    if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
      rainDrops[i] = 0;
    }
    rainDrops[i]++;
  }
  requestAnimationFrame(draw);
}

window.addEventListener("resize", function () {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  columns = Math.floor(canvas.width / fontSize);
  rainDrops = Array(columns).fill(1);
});

function updateClock() {
  document.getElementById("clock").textContent = new Date().toLocaleTimeString("zh-CN");
}
setInterval(updateClock, 1000);
updateClock();

const terminalText = document.getElementById("typing-text");
const commandLine = document.getElementById("command-line");
const commandInput = document.getElementById("command-input");

const messages = [
  { text: "正在初始化系统...", delay: 50 },
  { text: "正在加载个人资料...", delay: 50 },
  { text: "██████████████ 100%", delay: 30, style: "color:#0ff" },
  { text: "\n", delay: 200 },
  { text: "> 欢迎进入赛博终端 // 访问已授权", delay: 10, style: "color:#0f0;font-weight:bold" },
  { text: "\n\n", delay: 100 },
  { text: "> 名称：", delay: 20 },
  { text: "Taoshenn", delay: 100, style: "color:#0ff;font-weight:bold" },
  { text: "\n", delay: 50 },
  { text: "> 身份：", delay: 20 },
  { text: "东北林业大学 · 大三在读", delay: 50, style: "color:#0ff" },
  { text: "\n", delay: 50 },
  { text: "> 站点：", delay: 20 },
  { text: "taoshenn.cloud", delay: 50, style: "color:#0ff" },
  { text: "\n", delay: 50 },
  { text: "> 简介：", delay: 20 },
  { text: "个人站点。后续将在此展示参赛项目，供评委审阅。", delay: 30, style: "color:#0ff" },
  { text: "\n", delay: 50 },
  { text: "> 状态：", delay: 20 },
  { text: "在线", delay: 50, style: "color:#0f0" },
  { text: "\n\n", delay: 100 },
  { text: "> 输入「帮助」查看可用命令", delay: 30, style: "color:#0f0" },
  { text: "\n", delay: 50 },
];

let currentMessageIndex = 0;
let currentCharIndex = 0;

function typeNextCharacter() {
  if (currentMessageIndex >= messages.length) {
    commandLine.classList.remove("hidden");
    commandInput.focus();
    return;
  }
  const currentMessage = messages[currentMessageIndex];
  const textToType = currentMessage.text;
  if (currentCharIndex < textToType.length) {
    const span = document.createElement("span");
    span.textContent = textToType.charAt(currentCharIndex);
    if (currentMessage.style) span.style.cssText = currentMessage.style;
    terminalText.appendChild(span);
    currentCharIndex++;
    setTimeout(typeNextCharacter, currentMessage.delay);
  } else {
    currentMessageIndex++;
    currentCharIndex = 0;
    setTimeout(typeNextCharacter, 100);
  }
}

function processCommand(command) {
  terminalText.appendChild(document.createElement("br"));
  const prompt = document.createElement("span");
  prompt.textContent = "> ";
  prompt.style.color = "#0f0";
  terminalText.appendChild(prompt);
  const cmdText = document.createElement("span");
  cmdText.textContent = command;
  cmdText.style.color = "#e0e0e0";
  terminalText.appendChild(cmdText);
  terminalText.appendChild(document.createElement("br"));

  const response = document.createElement("div");
  response.style.marginTop = "6px";
  const cmd = command.toLowerCase().trim();

  if (cmd === "帮助" || cmd === "help" || cmd === "?") {
    response.innerHTML =
      "可用命令：<br>" +
      "- <span style=\"color:#0ff\">帮助</span>：显示本列表<br>" +
      "- <span style=\"color:#0ff\">关于</span>：个人简介<br>" +
      "- <span style=\"color:#0ff\">项目</span>：参赛 / 作品列表<br>" +
      "- <span style=\"color:#0ff\">联系</span>：联系方式<br>" +
      "- <span style=\"color:#0ff\">清空</span>：清空终端<br>" +
      "- <span style=\"color:#0ff\">退出</span>：尝试退出";
  } else if (cmd === "关于" || cmd === "about") {
    response.innerHTML =
      "名称：Taoshenn<br>" +
      "身份：东北林业大学大三在读学生<br>" +
      "站点：个人主页，后续将挂载参赛项目供评委审阅。";
  } else if (cmd === "项目" || cmd === "projects") {
    response.innerHTML =
      "暂无公开项目。<br>比赛作品上线后，将在此列出入口与说明。";
  } else if (cmd === "联系" || cmd === "contact") {
    response.innerHTML =
      '邮箱：<a href="mailto:501831625@qq.com" style="color:#b19cd9">501831625@qq.com</a>';
  } else if (cmd === "清空" || cmd === "clear") {
    terminalText.innerHTML = "";
    return;
  } else if (cmd === "退出" || cmd === "exit") {
    response.innerHTML =
      '<span style="color:#f44">拒绝访问：终端无法关闭 😎</span>';
  } else {
    response.innerHTML =
      `<span style="color:#f44">未知命令：${command}</span><br>输入「帮助」查看可用命令。`;
  }

  terminalText.appendChild(response);
  terminalText.appendChild(document.createElement("br"));
  commandLine.scrollIntoView();
}

commandInput.addEventListener("keydown", function (e) {
  if (e.key === "Enter") {
    const cmd = this.value;
    this.value = "";
    if (cmd.trim() !== "") processCommand(cmd);
  }
});

window.addEventListener("load", function () {
  draw();
  typeNextCharacter();
});
</script>
</body>
</html>
