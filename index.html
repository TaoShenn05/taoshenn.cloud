<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>taoshenn.cloud</title>
  <style>
    :root {
      --bg0: #0c1218;
      --bg1: #142029;
      --ink: #e8eef2;
      --muted: #8a9aa8;
      --accent: #3d9a8b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(61, 154, 139, 0.18), transparent 55%),
        radial-gradient(ellipse 70% 50% at 90% 80%, rgba(40, 80, 120, 0.25), transparent 50%),
        linear-gradient(165deg, var(--bg0), var(--bg1));
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    main {
      max-width: 36rem;
      text-align: center;
    }

    .brand {
      font-size: clamp(2.4rem, 8vw, 3.6rem);
      font-weight: 650;
      letter-spacing: -0.03em;
      line-height: 1.1;
      animation: rise 0.8s ease-out both;
    }

    .brand span {
      color: var(--accent);
    }

    p {
      margin-top: 1rem;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
      animation: rise 0.8s ease-out 0.12s both;
    }

    .line {
      width: 3rem;
      height: 2px;
      margin: 1.5rem auto 0;
      background: var(--accent);
      opacity: 0.7;
      animation: rise 0.8s ease-out 0.2s both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <main>
    <h1 class="brand">taoshenn<span>.cloud</span></h1>
    <p>个人站点 · 建设中</p>
    <div class="line" aria-hidden="true"></div>
  </main>
</body>
</html>
