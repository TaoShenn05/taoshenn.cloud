  <style>
    :root {
      --bg0: #071018;
      --bg1: #0e1a28;
      --ink: #eef4f8;
      --muted: #8fa3b5;
      --ice: #7ec8e3;
      --ice-deep: #3a8fb5;
      --line: rgba(238, 244, 248, 0.12);
      --panel: rgba(14, 28, 42, 0.72);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Instrument Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);

    .wrap {

      margin: 0 auto;
    }

    .back {

      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid transparent;
      transition: color 0.2s, border-color 0.2s;
    }
    .back:hover {
      color: var(--ice);
      border-bottom-color: var(--line);
    }

    .eyebrow {
      color: var(--ice);
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
      animation: rise 0.7s ease-out both;
    }

    h1 {
      font-family: "Noto Serif SC", "Songti SC", serif;
      font-weight: 600;
      font-size: clamp(1.85rem, 5.5vw, 2.4rem);
      line-height: 1.25;
      letter-spacing: 0.02em;
      margin-bottom: 0.85rem;
      animation: rise 0.7s ease-out 0.06s both;
    }

    .lead {
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.7;
      margin-bottom: 2rem;
      animation: rise 0.7s ease-out 0.12s both;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.25rem;
      color: var(--muted);
      font-size: 0.92rem;
      margin-bottom: 2.25rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--line);
      animation: rise 0.7s ease-out 0.16s both;
    }
    .meta strong { color: var(--ink); font-weight: 600; }

    .section {
      animation: rise 0.7s ease-out 0.2s both;
    }

    .section h2 {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      margin-bottom: 0.85rem;
      color: var(--ice);
    }

    .player {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 1.25rem 1.15rem;
      backdrop-filter: blur(8px);
    }

    .player p {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.55;
      margin-bottom: 1rem;
    }

    audio {
      width: 100%;
      height: 40px;
    }

    .note {
      margin-top: 0.85rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .note.warn { color: #e0a070; }
    .note a {
      color: var(--ice);
      text-decoration: none;
    }

    .footer {
      margin-top: 2.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--line);
      font-size: 0.9rem;
      color: var(--muted);
      animation: rise 0.7s ease-out 0.28s both;
    }
    .footer a {
      color: var(--ice);
      text-decoration: none;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      body { padding: 1.5rem 1rem 2.5rem; }
    }
  </style>
</head>
<body>
